<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday ❤️ Bhanu</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  overflow: hidden;
  background: black;
  color: white;
}

/* 🎥 VIDEO BACKGROUND */
#video {
  position: fixed;
  right: 0;
  bottom: 0;
  min-width: 100%;
  min-height: 100%;
  z-index: -1;
  opacity: 0.4;
}

/* 🎁 START SCREEN */
#start {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
}

button {
  padding: 12px 25px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  font-size: 18px;
}

/* 📱 STORY STYLE */
.story {
  display: none;
  height: 100vh;
  text-align: center;
  padding: 20px;
  background: rgba(0,0,0,0.5);
}

h1 {
  font-size: 35px;
}

/* 📸 SLIDESHOW */
.slide {
  width: 80%;
  max-width: 300px;
  border-radius: 15px;
  display: none;
}

/* 💖 HEARTS */
.heart {
  position: fixed;
  font-size: 18px;
  animation: float 6s linear infinite;
}

@keyframes float {
  from { transform: translateY(100vh); opacity: 1; }
  to { transform: translateY(-10vh); opacity: 0; }
}

/* 🎁 GIFT */
.gift {
  font-size: 60px;
  cursor: pointer;
}

/* 🎉 FINAL */
#final {
  display: none;
  padding: 20px;
}
</style>
</head>

<body>

<!-- 🎥 VIDEO -->
<video autoplay muted loop id="video">
  <source src="bg.mp4" type="video/mp4">
</video>

<!-- 🎁 START -->
<div id="start">
  <h1>🎁 A GOD LEVEL SURPRISE FOR BHANU ❤️</h1>
  <button onclick="start()">Tap to Begin 💖</button>
</div>

<!-- 📱 STORY -->
<div class="story" id="story">

<h1>❤️ Happy Birthday Bhanu ❤️</h1>

<div class="gift" onclick="openGift()">🎁</div>

<img class="slide" id="img1" src="1.jpg">
<img class="slide" id="img2" src="2.jpg">
<img class="slide" id="img3" src="3.jpg">

<p id="type"></p>

</div>

<!-- 🎉 FINAL -->
<div id="final">
  <h1>🎉 YOU UNLOCKED MY HEART ❤️</h1>

  <p>
    Bhanu 💖<br><br>

    You are not just special… you are my whole emotion ❤️<br>
    Every smile of yours = my peace 😘<br><br>

    I may not say it daily, but you mean a lot to me 🥺<br>
    Happy Birthday My Love 🎂💖
  </p>
</div>

<script>

function start(){
  document.getElementById("start").style.display = "none";
  document.getElementById("story").style.display = "block";

  launchHearts();
}

/* 🎁 gift open */
function openGift(){
  document.getElementById("story").style.display = "none";
  document.getElementById("final").style.display = "block";

  launchHearts();
}

/* 💖 hearts */
function launchHearts(){
  setInterval(() => {
    let h = document.createElement("div");
    h.classList.add("heart");
    h.innerHTML = "💖";
    h.style.left = Math.random()*100 + "vw";
    document.body.appendChild(h);

    setTimeout(() => h.remove(), 6000);
  }, 100);
}

/* 📸 slideshow */
let imgs = ["img1","img2","img3"];
let i = 0;

setInterval(() => {
  imgs.forEach(id => {
    let el = document.getElementById(id);
    if(el) el.style.display = "none";
  });

  let cur = document.getElementById(imgs[i]);
  if(cur) cur.style.display = "block";

  i = (i+1) % imgs.length;
}, 2000);

/* ⌨️ typing */
let text = "Bhanu ❤️ You are my happiness, my smile, my peace. Happy Birthday My Love 🎂💖";
let t = 0;

setInterval(() => {
  if(t < text.length){
    document.getElementById("type").innerHTML += text.charAt(t);
    t++;
  }
}, 50);

</script>

</body>
</html>
